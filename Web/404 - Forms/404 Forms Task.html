<!-- TASK

Create an HTML form for registering youth soccer players with validation.

Your form should include the following fields:

First Name (required)
Last Name (required)
Age (required, must be between 8-16)
Parent/Guardian Email (required, valid email format)
Mobile Phone Number (required)
T-Shirt Size (dropdown: XS, S, M, L, XL)
Previous Soccer Experience (radio buttons: None, 1-2 Years, 3+ Years)

Validation requirements

All required fields must be completed
Age must be between 8-16
Email must be in valid format
Mobile Phone Number must be in xxxx xxx xxxx format
Display error messages for invalid fields
-->

<html>

<head>
    <title> Soccer Players</title>
</head>

<main>
    <section>
        <h1>Registering youth soccer players with validation</h1>
    </section>

    <section id="form">

        <form action="/action_page.php" method="get">
            <label for="fname">First name</label>
            <input type="text" name="First Name" required />

            <br>
            <br>

            <label for="lname">Last Name</label>
            <input type="text" name="Last Name" required />

            <br>
            <br>

            <label for="n1">How old are you?</label>
            <input type="number" min="8" max="16" step="1" name="age" pattern="\d+" required/>

            <br>
            <br>

            <label for="t2">What's your e-mail address?</label>
            <input type="email" id="t2" name="email" required />

            <br>
            <br>

            <label for="t3">What's your phone number?</label>
            <input type="num" id="t3" name="phonenum" pattern="[0-9]{4}[0-9]{3}[0-9]{4}"/>

            <br>
            <br>

            <label for="t1">What's your T-shirt size<span aria-label="required">*</span></label>
            <input type="text" id="t1" name="T-shirt size" list="l1"/>
            <datalist id="l1">
                <option>XS</option>
                <option>S</option>
                <option>M</option>
                <option>X</option>
                <option>XL</option>
            </datalist>

            <br>&nbsp;
            <br>

            <label>Previous Soccer Experience</label>
            <br>
            <input type="radio" name="q1" required>None<br/>
            <input type="radio" name="q1" required>1-2 years<br/>
            <input type="radio" name="q1" required>3+ years<br/>

            <br>
            <br>

            <input type="submit">
        </form>

    </section>



</main>

</html>
